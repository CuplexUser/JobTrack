name: CI

# Lint, typecheck and the full vitest suite (apps/api, apps/web and packages/shared), so
# regressions are caught before merge rather than at publish time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run irrelevant — except on main, where
# every commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # onnxruntime-node's install script otherwise downloads its CUDA and TensorRT provider
      # libraries from Microsoft's NuGet feed on every Linux x64 install. Nothing here uses a
      # GPU, and a timeout on that feed fails the whole run.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      # Oxlint needs no build and takes well under a second on this repo, so it runs first:
      # an unused import is worth hearing about before a three-minute typecheck and suite.
      # Warnings are reported without failing the run; only the `correctness` rules do that.
      # The tree is at zero of both, so `--deny-warnings` is available whenever that is worth
      # enforcing rather than trusting.
      - name: Lint
        run: npm run lint

      # `tsc --build --force` walks the project references in tsconfig.json, so this also
      # builds @jobtrack/shared's dist — which the test run needs.
      - name: Typecheck
        run: npm run typecheck

      # No network needed: the search suite uses FakeEmbedder rather than downloading a
      # transformers model.
      - name: Test
        run: npm test

  # The Windows app layer is outside every tsconfig project reference and every vitest root, so the
  # job above cannot see it at all. Building it here means a C# compile break is caught in review
  # rather than at release time, when the installer workflow is the first thing to touch it.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Build only. The payload build and its smoke test belong to the release workflow: they pull
      # ~100 MB from the registry and download an embedding model, which is too much for every push.
      - name: Build the tray host
        run: dotnet build windows/JobTrack.Host/JobTrack.Host.csproj -c Release
